<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورود به پنل مدیریت</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>body { font-family: 'Vazirmatn', sans-serif; background-color: #f4f6f9; }</style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card p-4 shadow-sm border-0 rounded-4 mt-5">
                    <h4 class="text-center mb-4 fw-bold">ورود به پنل مدیریت</h4>
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}{% for cat, msg in messages %}
                            <div class="alert alert-{{ cat }} text-center py-2">{{ msg }}</div>
                        {% endfor %}{% endif %}
                    {% endwith %}
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">رمز عبور:</label>
                            <input type="password" class="form-control" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100">ورود</button>
                    </form>
                    <div class="text-center mt-3"><a href="/" class="text-muted small text-decoration-none">بازگشت به سایت</a></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
